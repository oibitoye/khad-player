name: Release

# Controlled releases only: version tags or manual dispatch.
# Does not publish to PyPI/Homebrew. Does not run on ordinary pull requests.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build (for example v0.1.0-alpha.1). Leave empty when triggered by tag push."
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate-and-build:
    name: Validate and build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
          python -m pip install build

      - name: Compile
        run: python -m compileall -q src

      - name: Lint
        run: python -m ruff check src tests

      - name: Unit tests
        run: python -m pytest tests/unit -q

      - name: Build sdist and wheel
        run: python -m build

      - name: Verify version consistency
        run: |
          python - <<'PY'
          import os
          import re
          import tomllib
          from pathlib import Path

          version = tomllib.loads(Path("pyproject.toml").read_text())["project"]["version"]
          init = Path("src/khad_media_player/__init__.py").read_text()
          assert f'__version__ = "{version}"' in init, (version, init)

          github_ref = os.environ.get("GITHUB_REF", "")
          if github_ref.startswith("refs/tags/v"):
              tag = github_ref.removeprefix("refs/tags/")
              sem = tag[1:]
              # v0.1.0-alpha.1 -> 0.1.0a1 ; v0.1.0-rc.1 -> 0.1.0rc1
              pep = re.sub(r"-alpha\.(\d+)", r"a\1", sem)
              pep = re.sub(r"-beta\.(\d+)", r"b\1", pep)
              pep = re.sub(r"-rc\.(\d+)", r"rc\1", pep)
              assert pep == version, f"tag {tag} normalises to {pep}, package is {version}"
              print("tag/package version OK:", tag, "->", version)
          else:
              print("version OK:", version)
          PY

      - name: Verify wheel install
        run: |
          chmod +x scripts/verify_wheel_install.sh
          ./scripts/verify_wheel_install.sh

      - name: Build .deb
        run: |
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends dpkg-dev
          chmod +x scripts/build_deb.sh
          ./scripts/build_deb.sh

      - name: Verify .deb launcher portability
        run: |
          set -euo pipefail
          DEB="$(ls -1 dist/khad-media-player_*.deb | head -1)"
          STAGE="$(mktemp -d)"
          dpkg-deb -x "$DEB" "$STAGE"
          test "$(head -1 "$STAGE/usr/bin/khad-media-player")" = "#!/usr/bin/python3"
          test -f "$STAGE/usr/lib/python3/dist-packages/khad_media_player/application.py"
          if compgen -G "$STAGE/usr/lib/python3.*/site-packages" >/dev/null; then
            echo "Non-portable site-packages layout found" >&2
            exit 1
          fi

      - name: Generate SHA256SUMS
        run: |
          cd dist
          shasum -a 256 * > SHA256SUMS
          cat SHA256SUMS

      - name: Upload dist artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-dist
          path: |
            dist/*
          if-no-files-found: error

  github-release:
    name: Create GitHub Release
    needs: validate-and-build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: release-dist
          path: dist

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref_name, 'alpha') || contains(github.ref_name, 'beta') || contains(github.ref_name, 'rc') }}
          body: |
            Early preview — see `docs/KNOWN_LIMITATIONS.md`.

            **Not included:** macOS `.app`, PyPI/Homebrew publish, unverified platform claims.

            **Install:** wheel/sdist below, plus system GTK/mpv/yt-dlp per `docs/INSTALL_*.md`.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
