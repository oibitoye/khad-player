[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "khad-media-player"
version = "0.1.0a3"
description = "Cross-platform GTK media player powered by mpv"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Khad Media Player contributors" }]
keywords = ["media", "player", "mpv", "gtk", "youtube"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: X11 Applications :: GTK",
  "Intended Audience :: End Users/Desktop",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Multimedia :: Video :: Display",
]
dependencies = []

[project.optional-dependencies]
embed = [
  "mpv>=1.0.0",
]
dev = [
  "pytest>=7.4",
  "ruff>=0.6",
]

[project.scripts]
khad-media-player = "khad_media_player.application:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  "legacy",
  "src/app.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# gi.require_version() must run before gi.repository imports.
ignore = ["E402"]

[tool.ruff.lint.per-file-ignores]
"src/khad_media_player/ui/*.py" = ["I001"]
"src/khad_media_player/application.py" = ["I001"]
"src/khad_media_player/player/embedded_backend.py" = ["I001"]
